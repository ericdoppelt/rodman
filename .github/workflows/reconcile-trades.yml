name: Reconcile pending trades

on:
  schedule:
    # 13:30 UTC (~9:30am ET, NYSE open), Mon-Fri. A market day-order either fills within seconds
    # of open or (rarely) doesn't — the script itself polls for up to 30 min and exits non-zero
    # if anything's still unresolved after that, which triggers GitHub's default failure-email
    # notification. See docs/decisions/0014-poll-and-alert-trade-reconciliation.md.
    - cron: '30 13 * * 1-5'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm reconcile-trades
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
