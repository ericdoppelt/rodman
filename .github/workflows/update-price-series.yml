name: Update pick price series

on:
  schedule:
    # Every 15 min, 13:00-21:30 UTC (~9am-5:30pm ET), Mon-Fri — covers premarket through
    # after-hours around a normal trading session, matching the 15-min bar granularity fetched
    # below (polling faster than the bar size just refetches the same in-progress bar). At
    # today's pick volume (1/weekday, refetching full history each run) this is well within
    # Alpaca's free-tier 200-calls/min limit; see BACKLOG.md for the incremental-fetch work
    # needed before pushing cadence much higher.
    - cron: '0,15,30,45 13-21 * * 1-5'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm update-pick-price-series
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
