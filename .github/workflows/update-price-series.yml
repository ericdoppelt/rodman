name: Update pick price series and reconcile trades

on:
  schedule:
    # GitHub's native schedule trigger is best-effort and can silently drop runs under load
    # (confirmed in GitHub's own docs, not just observed here) — kept here only as a bonus
    # fallback, not the real mechanism, so there's no reason to fuss over its exact minute offset.
    # The actual 15-min cadence is driven by an external pinger (cron-job.org, free) calling this
    # workflow's `workflow_dispatch` on schedule instead, since that's the only way to get a
    # reliable 15-min guarantee. See BACKLOG.md and docs/decisions/0014.
    - cron: '0,15,30,45 13-21 * * 1-5'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm update-pick-price-series
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Folded in here (rather than its own single-shot cron) so a dropped trigger self-heals —
      # the next firing 15 min later just catches up, instead of silently reconciling zero times
      # that day. reconcileTrades.ts itself is a fast no-op whenever there's nothing pending, so
      # running it this often costs nothing extra beyond the request itself.
      - run: pnpm reconcile-trades
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
